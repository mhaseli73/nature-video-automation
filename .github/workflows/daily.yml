
name: Travel Video AI Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: travel-video-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline.py

      - name: Save AI decision history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/decision_history.json
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Update AI decision history"
            git push
          fi

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: travel-video-output
          path: output/
          if-no-files-found: warn
